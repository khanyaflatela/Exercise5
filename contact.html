<!DOCTYPE html>
<html lang="en"></html>
<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Contact Us</h1>
        <p>We would love to hear from you!</p>
    </header>

    <main>
        <section>
            <h2>Contact Form</h2>
            <form>
                <label>Name:</label>
                <input type="text" name="name" required>

                <label>Email:</label>
                <input type="email" name="email" required>

                <label>Phone:</label>
                <input type="tel" name="phone" required>

                <label>Subject:</label>
                <select name="subject">
                    <option value="general">General Enquiry</option>
                    <option value="support">Support</option>
                    <option value="feedback">Feedback</option>
                    <option value="booking">Booking</option>
                </select>

                <label>Message:</label>
                <textarea name="message" rows="5" required></textarea>

                <button type="submit">Submit</button>
            </form>
        </section>

        <section>
            <h2>Available Appointment Times</h2>
            <div class="table-container">
                <table>
                    <tr>
                        <th>Day</th>
                        <th>Time</th>
                        <th>Available</th>
                    </tr>
                    <tr>
                        <td>Monday</td>
                        <td>09:00 - 10:00</td>
                        <td>Yes</td>
                    </tr>
                    <tr>
                        <td>Tuesday</td>
                        <td>10:00 - 11:00</td>
                        <td>Yes</td>
                    </tr>
                    <tr>
                        <td>Wednesday</td>
                        <td>11:00 - 12:00</td>
                        <td>No</td>
                    </tr>
                    <tr>
                        <td>Thursday</td>
                        <td>13:00 - 14:00</td>
                        <td>Yes</td>
                    </tr>
                    <tr>
                        <td>Friday</td>
                        <td>14:00 - 15:00</td>
                        <td>Yes</td>
                    </tr>
                </table>
            </div>
        </section>
    </main>

</body>
</html>
